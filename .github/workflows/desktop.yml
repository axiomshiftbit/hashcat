name: Desktop GUI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.2 win64_msvc2022_64 --archives qtbase -O C:\Qt
          "C:\Qt\6.10.2\msvc2022_64\bin" >> $env:GITHUB_PATH
      - name: Build
        shell: pwsh
        run: |
          cmake -S gui -B gui/build -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.10.2/msvc2022_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build gui/build --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Synthetic GUI and process tests
        shell: pwsh
        run: |
          $env:GUI_SCREENSHOT = "$env:RUNNER_TEMP\desktop-windows.png"
          ctest --test-dir gui/build -C Release --output-on-failure
          $result = $LASTEXITCODE
          Get-Content gui/build/desktop-results.txt
          if ($result) { exit $result }
      - name: Hashcat and CPU OpenCL runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/hashcat/hashcat/releases/download/v8.0.0/hashcat-8.0.0.7z -OutFile "$env:RUNNER_TEMP\hashcat.7z"
          if ((Get-FileHash "$env:RUNNER_TEMP\hashcat.7z").Hash -ne '9fa86e1bfd5dd898d3c83aa38a67b08db1ba5d2f5252dffa2af44a8c62585f49') { throw 'Hashcat digest mismatch' }
          7z x "$env:RUNNER_TEMP\hashcat.7z" "-o$env:RUNNER_TEMP\engine" -y
          Invoke-WebRequest https://github.com/pocl/pocl/releases/download/v7.2/PoCL-7.2.0-win64.exe -OutFile "$env:RUNNER_TEMP\pocl.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\pocl.exe").Hash -ne '474e4321728c022132b872ea7b4c1158756f3344ffd703adb8b0f9b5cde37593') { throw 'PoCL digest mismatch' }
          $install = Start-Process "$env:RUNNER_TEMP\pocl.exe" -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "PoCL install failed: $($install.ExitCode)" }
      - name: Real Hashcat integration
        shell: pwsh
        run: |
          $env:REAL_HASHCAT = "$env:RUNNER_TEMP\engine\hashcat-8.0.0\hashcat.exe"
          $env:POCL_MAX_PTHREAD_COUNT = '2'
          $env:POCL_CPU_MAX_CU_COUNT = '2'
          & gui/build/Release/desktop_tests.exe real_hashcat_dictionary real_controls_and_restore -o "$env:RUNNER_TEMP\real-windows.txt,txt"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\real-windows.txt"
          if ($result) { exit $result }
      - name: Document extraction integration
        shell: pwsh
        run: |
          python -m pip install pypdf==6.21.4 pyhanko==0.38.1 msoffcrypto-tool==6.1.0 python-docx==1.2.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:JOHN_RUN = "$env:RUNNER_TEMP\john-tools"
          New-Item -ItemType Directory -Force $env:JOHN_RUN | Out-Null
          foreach ($tool in @('pdf2john.py', 'office2john.py', '7z2john.pl')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/openwall/john/5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/$tool" -OutFile "$env:JOHN_RUN\$tool"
          }
          $env:DOCUMENT_FIXTURES = "$env:RUNNER_TEMP\document fixtures"
          $env:TEST_PYTHON = (Get-Command python).Source
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if ($perl) {
            & $perl.Source -MCompress::Raw::Lzma -e 1 2>$null
            if ($LASTEXITCODE -eq 0) { $env:TEST_PERL = $perl.Source }
          }
          python gui/tests/generate_documents.py $env:DOCUMENT_FIXTURES
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:REAL_HASHCAT = "$env:RUNNER_TEMP\engine\hashcat-8.0.0\hashcat.exe"
          $env:POCL_MAX_PTHREAD_COUNT = '2'
          $env:GUI_SCREENSHOT = "$env:RUNNER_TEMP\documents-windows.png"
          $env:POCL_CPU_MAX_CU_COUNT = '2'
          $env:HASHCAT_TEST_SCALAR = '1'
          & gui/build/Release/desktop_tests.exe real_document_extraction -o "$env:RUNNER_TEMP\documents-windows.txt,txt"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\documents-windows.txt"
          if ($result) { exit $result }
      - name: WSL capture conversion
        shell: pwsh
        run: |
          $base = 'https://cdimages.ubuntu.com/ubuntu-wsl/noble/daily-live/current'
          Invoke-WebRequest "$base/noble-wsl-amd64.wsl" -OutFile "$env:RUNNER_TEMP\ubuntu.wsl"
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile "$env:RUNNER_TEMP\ubuntu-checksums.txt"
          $expected = (Get-Content "$env:RUNNER_TEMP\ubuntu-checksums.txt" | Where-Object { $_ -match 'noble-wsl-amd64.wsl$' }).Split(' ')[0]
          if ((Get-FileHash "$env:RUNNER_TEMP\ubuntu.wsl").Hash -ne $expected) { throw 'Ubuntu digest mismatch' }
          wsl --import HashcatTest "$env:RUNNER_TEMP\wsl" "$env:RUNNER_TEMP\ubuntu.wsl" --version 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wsl --set-default HashcatTest
          wsl --exec apt-get update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wsl --exec apt-get install -y --no-install-recommends hcxtools python3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CAPTURE_FIXTURES = "$env:RUNNER_TEMP\capture fixtures"
          $linuxFixtures = (wsl --exec wslpath -u $env:CAPTURE_FIXTURES).Trim()
          $generator = (wsl --exec wslpath -u "$env:GITHUB_WORKSPACE\gui\tests\generate_captures.py").Trim()
          wsl --exec python3 $generator $linuxFixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:HCX_WSL = '1'
          $env:REAL_HASHCAT = "$env:RUNNER_TEMP\engine\hashcat-8.0.0\hashcat.exe"
          $env:POCL_MAX_PTHREAD_COUNT = '2'
          & gui/build/Release/desktop_tests.exe real_converter ui_converter_to_task -o "$env:RUNNER_TEMP\converters-windows.txt,txt"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\converters-windows.txt"
          if ($result) { exit $result }
      - name: Qt sources and licenses
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 180 https://master.qt.io/archive/qt/6.10/6.10.2/submodules/qtbase-everywhere-src-6.10.2.tar.xz --output "$env:RUNNER_TEMP\qtbase-source-6.10.2.tar.xz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash "$env:RUNNER_TEMP\qtbase-source-6.10.2.tar.xz").Hash -ne 'aeb78d29291a2b5fd53cb55950f8f5065b4978c25fb1d77f627d695ab9adf21e') { throw 'Qt source digest mismatch' }
      - name: Deploy Windows runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui/dist/HashcatDesktop | Out-Null
          Copy-Item gui/build/Release/hashcat-desktop.exe gui/dist/HashcatDesktop/
          windeployqt --release --no-translations --no-opengl-sw --no-compiler-runtime gui/dist/HashcatDesktop/hashcat-desktop.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP\engine\hashcat-8.0.0" gui/dist/HashcatDesktop/hashcat -Recurse
          if (Test-Path gui/dist/HashcatDesktop/hashcat/cache) { Remove-Item gui/dist/HashcatDesktop/hashcat/cache -Recurse -Force }
          Copy-Item gui/README*.md gui/dist/HashcatDesktop/
          Copy-Item gui/LICENSE gui/dist/HashcatDesktop/LICENSE.txt
          Copy-Item gui/THIRD_PARTY.md gui/dist/HashcatDesktop/
          git archive --format=tar.gz --output=gui/dist/HashcatDesktop/HashcatDesktop-source.tar.gz HEAD gui .github/workflows/desktop.yml docs/license.txt docs/credits.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Include Qt sources and notices
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui/dist/HashcatDesktop/licenses | Out-Null
          Copy-Item docs/license.txt gui/dist/HashcatDesktop/licenses/hashcat-MIT.txt
          Copy-Item "$env:RUNNER_TEMP\qtbase-source-6.10.2.tar.xz" gui/dist/HashcatDesktop/licenses/
          python gui/tests/package_qt_notices.py gui/dist/HashcatDesktop/licenses/qtbase-source-6.10.2.tar.xz gui/dist/HashcatDesktop/licenses
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item C:/Qt/6.10.2/msvc2022_64/sbom gui/dist/HashcatDesktop/licenses/ -Recurse
          Copy-Item C:/Qt/6.10.2/msvc2022_64/config_qtbase.* gui/dist/HashcatDesktop/licenses/
      - name: Packaged Windows startup
        timeout-minutes: 1
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike 'C:\Qt\*' }) -join ';'
          $app = Start-Process gui/dist/HashcatDesktop/hashcat-desktop.exe -ArgumentList '--data-dir', "$env:RUNNER_TEMP\package-smoke" -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($app.HasExited) { throw "Packaged application exited: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Archive Windows package
        timeout-minutes: 3
        shell: pwsh
        working-directory: gui/dist
        run: |
          7z a -tzip -mx=5 -mmt=2 HashcatDesktop-Windows-x64.zip HashcatDesktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HashcatDesktop-Windows-x64
          path: gui/dist/HashcatDesktop-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Windows-test-results
          path: |
            gui/build/Testing/Temporary/LastTest.log
            gui/build/desktop-results.txt
            ${{ runner.temp }}/desktop-windows.png*
            ${{ runner.temp }}/real-windows.txt
            ${{ runner.temp }}/converters-windows.txt
            ${{ runner.temp }}/documents-windows.txt
            ${{ runner.temp }}/documents-windows.png*
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev ninja-build hashcat pocl-opencl-icd ocl-icd-libopencl1 hcxtools xvfb xauth p7zip-full python3-venv libcompress-raw-lzma-perl
      - name: Build
        run: cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build gui/build -j2
      - name: Test
        env:
          REAL_HASHCAT: /usr/bin/hashcat
          POCL_MAX_PTHREAD_COUNT: '2'
          POCL_CPU_MAX_CU_COUNT: '2'
          GUI_SCREENSHOT: /tmp/desktop-linux.png
          CAPTURE_FIXTURES: /tmp/desktop-captures
        run: |
          python3 gui/tests/generate_captures.py /tmp/desktop-captures
          ctest --test-dir gui/build --output-on-failure || { cat gui/build/desktop-results.txt; exit 1; }
          cat gui/build/desktop-results.txt
          QT_QPA_PLATFORM=xcb xvfb-run -a gui/build/desktop_tests ui_queue_language_results_and_reload ui_expert_any_arguments
      - name: Hashcat 8 modes and document extraction
        env:
          POCL_MAX_PTHREAD_COUNT: '2'
          POCL_CPU_MAX_CU_COUNT: '2'
          QT_QPA_PLATFORM: offscreen
          GUI_SCREENSHOT: /tmp/documents-linux.png
        run: |
          curl --fail --location --retry 2 https://github.com/hashcat/hashcat/releases/download/v8.0.0/hashcat-8.0.0.7z -o "$RUNNER_TEMP/hashcat.7z"
          python3 -c 'import hashlib,os; assert hashlib.sha256(open(os.environ["RUNNER_TEMP"]+"/hashcat.7z","rb").read()).hexdigest()=="9fa86e1bfd5dd898d3c83aa38a67b08db1ba5d2f5252dffa2af44a8c62585f49"'
          7z x "$RUNNER_TEMP/hashcat.7z" "-o$RUNNER_TEMP/engine" -y > /dev/null
          export REAL_HASHCAT="$RUNNER_TEMP/engine/hashcat-8.0.0/hashcat.bin"
          chmod +x "$REAL_HASHCAT"
          python3 -m venv "$RUNNER_TEMP/document-python"
          export TEST_PYTHON="$RUNNER_TEMP/document-python/bin/python"
          "$TEST_PYTHON" -m pip install pypdf==6.21.4 pyhanko==0.38.1 msoffcrypto-tool==6.1.0 python-docx==1.2.0
          export JOHN_RUN="$RUNNER_TEMP/john-tools"
          mkdir -p "$JOHN_RUN"
          for tool in pdf2john.py office2john.py 7z2john.pl; do
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/openwall/john/5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/$tool" -o "$JOHN_RUN/$tool"
          done
          export DOCUMENT_FIXTURES="$RUNNER_TEMP/document fixtures"
          export TEST_PERL=/usr/bin/perl
          "$TEST_PYTHON" gui/tests/generate_documents.py "$DOCUMENT_FIXTURES"
          gui/build/desktop_tests real_hashcat_dictionary real_document_extraction -o /tmp/hashcat8-linux.txt,txt || { cat /tmp/hashcat8-linux.txt; exit 1; }
          cat /tmp/hashcat8-linux.txt
      - name: Package
        run: |
          mkdir -p gui/dist/HashcatDesktop
          cp gui/build/hashcat-desktop gui/README*.md gui/dist/HashcatDesktop/
          cp gui/LICENSE gui/dist/HashcatDesktop/LICENSE.txt
          cp gui/THIRD_PARTY.md gui/dist/HashcatDesktop/
          git archive --format=tar.gz --output=gui/dist/HashcatDesktop/HashcatDesktop-source.tar.gz HEAD gui .github/workflows/desktop.yml docs/license.txt docs/credits.txt
          tar -czf gui/dist/HashcatDesktop-Linux-x64.tar.gz -C gui/dist HashcatDesktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HashcatDesktop-Linux-x64
          path: gui/dist/HashcatDesktop-Linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Linux-test-results
          path: |
            gui/build/Testing/Temporary/LastTest.log
            gui/build/desktop-results.txt
            /tmp/desktop-linux.png*
            /tmp/hashcat8-linux.txt
            /tmp/documents-linux.png*
