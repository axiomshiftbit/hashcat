name: Desktop GUI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  converters:
    uses: ./.github/workflows/converters.yml
  windows:
    needs: converters
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Qt
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 180 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64/qt.qt6.6120.win64_msvc2022_64/6.12.0-0-202609280346qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z' --output "$env:RUNNER_TEMP\qtbase.7z"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash "$env:RUNNER_TEMP\qtbase.7z").Hash -ne '219d1b86def3be418e31d704572bc4acc91b2ec373c65595c9fb12b42bf098dc') { throw 'Qt binary digest mismatch' }
          7z x "$env:RUNNER_TEMP\qtbase.7z" -oC:\Qt\6.12.0\msvc2022_64 -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "[Paths]`nPrefix=.." | Set-Content C:/Qt/6.12.0/msvc2022_64/bin/qt.conf
          "C:\Qt\6.12.0\msvc2022_64\bin" >> $env:GITHUB_PATH
      - name: Build
        shell: pwsh
        run: |
          cmake -S gui -B gui/build -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.12.0/msvc2022_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build gui/build --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Synthetic GUI and process tests
        shell: pwsh
        run: |
          $env:GUI_SCREENSHOT = "$env:RUNNER_TEMP\desktop-windows.png"
          ctest --test-dir gui/build -C Release --output-on-failure
          $result = $LASTEXITCODE
          Get-Content gui/build/desktop-results.txt
          if ($result) { exit $result }
      - name: Hashcat and CPU OpenCL runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/hashcat/hashcat/releases/download/v8.0.0/hashcat-8.0.0.7z -OutFile "$env:RUNNER_TEMP\hashcat.7z"
          if ((Get-FileHash "$env:RUNNER_TEMP\hashcat.7z").Hash -ne '9fa86e1bfd5dd898d3c83aa38a67b08db1ba5d2f5252dffa2af44a8c62585f49') { throw 'Hashcat digest mismatch' }
          7z x "$env:RUNNER_TEMP\hashcat.7z" "-o$env:RUNNER_TEMP\engine" -y
          python -m venv "$env:RUNNER_TEMP\intel-opencl"
          & "$env:RUNNER_TEMP\intel-opencl\Scripts\python.exe" -m pip install --require-hashes -r gui/tests/windows-opencl-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = "$env:RUNNER_TEMP\intel-opencl\Library\bin"
          if (-not (Test-Path "$runtime\intelocl64.dll")) { throw 'Intel OpenCL runtime missing' }
          (Get-Content "$runtime\cl.cfg") -replace '^CL_CONFIG_TBB_DLL_PATH =.*', "CL_CONFIG_TBB_DLL_PATH = $runtime" | Set-Content "$runtime\cl.cfg"
          New-Item -Path HKLM:\SOFTWARE\Khronos\OpenCL\Vendors -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\Khronos\OpenCL\Vendors -Name "$runtime\intelocl64.dll" -Value 0 -PropertyType DWord -Force | Out-Null
          $runtime >> $env:GITHUB_PATH
          'CL_CONFIG_CPU_TBB_NUM_WORKERS=2' >> $env:GITHUB_ENV
          $env:PATH = "$runtime;$env:PATH"
          & "$env:RUNNER_TEMP\engine\hashcat-8.0.0\hashcat.exe" --backend-info
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Real Hashcat integration
        shell: pwsh
        run: |
          $env:REAL_HASHCAT = "$env:RUNNER_TEMP\engine\hashcat-8.0.0\hashcat.exe"
          & gui/build/Release/desktop_tests.exe real_hashcat_dictionary real_controls_and_restore -o "$env:RUNNER_TEMP\real-windows.txt,txt"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\real-windows.txt"
          if ($result) { exit $result }
      - name: Qt sources and licenses
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error --retry 2 --max-time 180 https://master.qt.io/archive/qt/6.12/6.12.0/submodules/qtbase-everywhere-src-6.12.0.tar.xz --output "$env:RUNNER_TEMP\qtbase-source-6.12.0.tar.xz"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash "$env:RUNNER_TEMP\qtbase-source-6.12.0.tar.xz").Hash -ne 'a951bd163c7b80fc6b8c88d7668fb56abf91c152373e13c10666763238131307') { throw 'Qt source digest mismatch' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Windows-converter-bundle
          path: gui/downloaded-tools
      - name: Deploy Windows runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui/dist/HashcatDesktop | Out-Null
          7z x gui/downloaded-tools/converter-bundle.zip -ogui/dist/HashcatDesktop -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item gui/build/Release/hashcat-desktop.exe gui/dist/HashcatDesktop/
          windeployqt --release --no-translations --no-opengl-sw --no-compiler-runtime gui/dist/HashcatDesktop/hashcat-desktop.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP\engine\hashcat-8.0.0" gui/dist/HashcatDesktop/hashcat -Recurse
          if (Test-Path gui/dist/HashcatDesktop/hashcat/cache) { Remove-Item gui/dist/HashcatDesktop/hashcat/cache -Recurse -Force }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'MSVC redistributable DLL directory not found' }
          Copy-Item "$($crt.FullName)\*.dll" gui/dist/HashcatDesktop/
          Copy-Item gui/README*.md gui/dist/HashcatDesktop/
          Copy-Item gui/LICENSE gui/dist/HashcatDesktop/LICENSE.txt
          Copy-Item gui/THIRD_PARTY.md gui/dist/HashcatDesktop/
          git archive --format=tar.gz --output=gui/dist/HashcatDesktop/HashcatDesktop-source.tar.gz HEAD gui .github/workflows/desktop.yml .github/workflows/converters.yml docs/license.txt docs/credits.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Include Qt sources and notices
        timeout-minutes: 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gui/dist/HashcatDesktop/licenses | Out-Null
          Copy-Item docs/license.txt gui/dist/HashcatDesktop/licenses/hashcat-MIT.txt
          Copy-Item "$env:RUNNER_TEMP\qtbase-source-6.12.0.tar.xz" gui/dist/HashcatDesktop/licenses/
          python gui/tests/package_qt_notices.py gui/dist/HashcatDesktop/licenses/qtbase-source-6.12.0.tar.xz gui/dist/HashcatDesktop/licenses
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item C:/Qt/6.12.0/msvc2022_64/sbom gui/dist/HashcatDesktop/licenses/ -Recurse
          Copy-Item C:/Qt/6.12.0/msvc2022_64/config_qtbase.* gui/dist/HashcatDesktop/licenses/
      - name: Test relocated package and bundled converters
        timeout-minutes: 12
        shell: pwsh
        run: |
          python -m pip install pypdf==6.21.4 msoffcrypto-tool==6.1.0 python-docx==1.2.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:DOCUMENT_FIXTURES = "$env:RUNNER_TEMP\document fixtures"
          python gui/tests/generate_documents.py $env:DOCUMENT_FIXTURES
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = "$env:RUNNER_TEMP\Перенос приложения\Hashcat Desktop"
          New-Item -ItemType Directory -Force (Split-Path $package) | Out-Null
          Move-Item gui/dist/HashcatDesktop $package
          python gui/packaging/verify_converters.py $package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$package\tools\cygwin\bin;$env:PATH"
          $env:CAPTURE_FIXTURES = "$env:RUNNER_TEMP\capture fixtures"
          python gui/tests/generate_captures.py $env:CAPTURE_FIXTURES --hash2cap "$package\tools\hcxtools\hcxhash2cap.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item gui/build/Release/desktop_tests.exe,gui/build/Release/fake_hashcat.exe $package/
          Copy-Item C:/Qt/6.12.0/msvc2022_64/bin/Qt6Test.dll $package/
          $env:REAL_HASHCAT = "$package\hashcat\hashcat.exe"
          $env:HCX_DIRECTORY = "$package\tools\hcxtools"
          $env:BUNDLED_TOOL_TEST = '1'
          $env:GUI_SCREENSHOT = "$env:RUNNER_TEMP\documents-windows.png"
          $env:PATH = "$env:RUNNER_TEMP\intel-opencl\Library\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & "$package\desktop_tests.exe" damaged_workspace_is_preserved real_document_extraction real_converter ui_converter_to_task -o "$env:RUNNER_TEMP\bundled-windows.txt,txt"
          $result = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP\bundled-windows.txt"
          if ($result) { exit $result }
          $app = Start-Process "$package\hashcat-desktop.exe" -ArgumentList '--data-dir', "$env:RUNNER_TEMP\package-smoke" -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($app.HasExited) { throw "Packaged application exited: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
          # Retain a separate test harness artifact for testing the exact package.
          New-Item -ItemType Directory -Force gui/test-harness | Out-Null
          Move-Item "$package/desktop_tests.exe","$package/fake_hashcat.exe","$package/Qt6Test.dll" gui/test-harness/
          Move-Item $package gui/dist/HashcatDesktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-test-harness
          path: gui/test-harness
          if-no-files-found: error
      - name: Archive Windows package
        timeout-minutes: 7
        shell: pwsh
        working-directory: gui/dist
        run: |
          7z a -tzip -mx=5 -mmt=2 HashcatDesktop-Windows-x64.zip HashcatDesktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HashcatDesktop-Windows-x64
          path: gui/dist/HashcatDesktop-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Windows-test-results
          path: |
            gui/build/Testing/Temporary/LastTest.log
            gui/build/desktop-results.txt
            ${{ runner.temp }}/desktop-windows.png*
            ${{ runner.temp }}/real-windows.txt
            ${{ runner.temp }}/converters-windows.txt
            ${{ runner.temp }}/bundled-windows.txt
            ${{ runner.temp }}/documents-windows.png*
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev ninja-build hashcat pocl-opencl-icd ocl-icd-libopencl1 hcxtools xvfb xauth p7zip-full python3-venv libcompress-raw-lzma-perl
      - name: Build
        run: cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build gui/build -j2
      - name: Test
        env:
          REAL_HASHCAT: /usr/bin/hashcat
          POCL_MAX_PTHREAD_COUNT: '2'
          POCL_CPU_MAX_CU_COUNT: '2'
          GUI_SCREENSHOT: /tmp/desktop-linux.png
          CAPTURE_FIXTURES: /tmp/desktop-captures
        run: |
          python3 gui/tests/generate_captures.py /tmp/desktop-captures
          ctest --test-dir gui/build --output-on-failure || { cat gui/build/desktop-results.txt; exit 1; }
          cat gui/build/desktop-results.txt
          QT_QPA_PLATFORM=xcb xvfb-run -a gui/build/desktop_tests ui_queue_language_results_and_reload ui_expert_any_arguments
      - name: Hashcat 8 modes and document extraction
        env:
          POCL_MAX_PTHREAD_COUNT: '2'
          POCL_CPU_MAX_CU_COUNT: '2'
          QT_QPA_PLATFORM: offscreen
          GUI_SCREENSHOT: /tmp/documents-linux.png
        run: |
          curl --fail --location --retry 2 https://github.com/hashcat/hashcat/releases/download/v8.0.0/hashcat-8.0.0.7z -o "$RUNNER_TEMP/hashcat.7z"
          python3 -c 'import hashlib,os; assert hashlib.sha256(open(os.environ["RUNNER_TEMP"]+"/hashcat.7z","rb").read()).hexdigest()=="9fa86e1bfd5dd898d3c83aa38a67b08db1ba5d2f5252dffa2af44a8c62585f49"'
          7z x "$RUNNER_TEMP/hashcat.7z" "-o$RUNNER_TEMP/engine" -y > /dev/null
          export REAL_HASHCAT="$RUNNER_TEMP/engine/hashcat-8.0.0/hashcat.bin"
          chmod +x "$REAL_HASHCAT"
          python3 -m venv "$RUNNER_TEMP/document-python"
          export TEST_PYTHON="$RUNNER_TEMP/document-python/bin/python"
          "$TEST_PYTHON" -m pip install pypdf==6.21.4 pyhanko==0.38.1 msoffcrypto-tool==6.1.0 python-docx==1.2.0
          export JOHN_RUN="$RUNNER_TEMP/john-tools"
          mkdir -p "$JOHN_RUN"
          for tool in pdf2john.py office2john.py 7z2john.pl; do
            curl --fail --location --retry 2 "https://raw.githubusercontent.com/openwall/john/5184bc0b8c105f8c5978b112e723d65b2de3e63e/run/$tool" -o "$JOHN_RUN/$tool"
          done
          export DOCUMENT_FIXTURES="$RUNNER_TEMP/document fixtures"
          export TEST_PERL=/usr/bin/perl
          "$TEST_PYTHON" gui/tests/generate_documents.py "$DOCUMENT_FIXTURES"
          gui/build/desktop_tests real_hashcat_dictionary real_document_extraction -o /tmp/hashcat8-linux.txt,txt || { cat /tmp/hashcat8-linux.txt; exit 1; }
          cat /tmp/hashcat8-linux.txt
      - name: Package
        run: |
          mkdir -p gui/dist/HashcatDesktop
          cp gui/build/hashcat-desktop gui/README*.md gui/dist/HashcatDesktop/
          cp gui/LICENSE gui/dist/HashcatDesktop/LICENSE.txt
          cp gui/THIRD_PARTY.md gui/dist/HashcatDesktop/
          git archive --format=tar.gz --output=gui/dist/HashcatDesktop/HashcatDesktop-source.tar.gz HEAD gui .github/workflows/desktop.yml .github/workflows/converters.yml docs/license.txt docs/credits.txt
          tar -czf gui/dist/HashcatDesktop-Linux-x64.tar.gz -C gui/dist HashcatDesktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HashcatDesktop-Linux-x64
          path: gui/dist/HashcatDesktop-Linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Linux-test-results
          path: |
            gui/build/Testing/Temporary/LastTest.log
            gui/build/desktop-results.txt
            /tmp/desktop-linux.png*
            /tmp/hashcat8-linux.txt
            /tmp/documents-linux.png*
